name: fasobiblio
description: Application mobile native de la bibliothèque numérique Fasobiblio.
publish_to: none
version: 2.2.0+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  pdfrx: ^2.5.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
