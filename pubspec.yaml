name: fasobiblio
description: Application mobile native de la bibliothèque numérique Fasobiblio.
publish_to: none
version: 1.1.0+14

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter_local_notifications: ^19.4.0
  image_picker: ^1.2.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  pdfrx: ^2.5.0
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  country_picker: ^2.0.27
  flutter_svg: ^2.0.17
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
  assets:
    - assets/branding/
    - assets/illustrations/
