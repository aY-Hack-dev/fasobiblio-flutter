name: fasobiblio
description: Application mobile native de la bibliothèque numérique Fasobiblio.
publish_to: none
version: 3.4.0+10

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  pdfrx: ^2.5.0
  flutter_tts: ^4.2.5
  webview_flutter: ^4.14.1
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.7+1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/
